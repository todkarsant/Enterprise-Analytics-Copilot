name: Research State Machine

on:
  push:
    branches:
      - "research/**"
  pull_request:

permissions:
  contents: read

jobs:
  state-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate repository research state
        run: python scripts/research_state_check.py --state IMPLEMENTED
      - name: Validate scientific-control files
        run: |
          test -f docs/PROJECT1_P6_IP_EXECUTION_HANDOFF.md
          test -f docs/PROJECT1_DEFENSIBILITY_LAYER.md
          test -f scripts/analyze_p6_ip.py
          test -f tests/test_p6_analysis_integrity.py
          grep -q 'official_execution_correct' scripts/analyze_p6_ip.py
          grep -q 'P6-IP' docs/PROJECT1_P6_IP_EXECUTION_HANDOFF.md
      - name: Validate P6 workflow protocol structure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/p6-ip-controlled.yml').read_text()
          required=['benchmark_development:','freeze_development:','benchmark_holdout:','aggregate:','needs: benchmark_development','needs: freeze_development','needs: benchmark_holdout']
          missing=[x for x in required if x not in p]
          if missing: raise SystemExit(f'Missing enforced protocol markers: {missing}')
          if 'on:\n  push:' in p: raise SystemExit('P6 controlled experiment must remain manual-only')
          print('STATE_MACHINE_PROTOCOL_OK')
          PY
      - name: Unit tests
        run: pytest -q tests/test_p6_ip.py tests/test_p6_analysis_integrity.py
