name: Project 1 Research State Gate

on:
  push:
    branches:
      - research/p6-ip-defensibility
  pull_request:
    branches:
      - research/p6-ip-defensibility

permissions:
  contents: read

jobs:
  state-and-protocol-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate research state machine
        run: python -m research.research_state_machine --state-file research/PROJECT1_RESEARCH_STATE.json
      - name: Validate P6 protocol ordering
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path('.github/workflows/p6-ip-controlled.yml').read_text()
          required = [
              'development:',
              'freeze-development:',
              'holdout:',
              'aggregate:',
              'needs: development',
              'needs: freeze-development',
              'needs: holdout',
              'p6-ip-development-chunk-',
              'p6-ip-development-freeze-',
              'p6-ip-holdout-chunk-',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('P6 protocol contract missing: ' + ', '.join(missing))
          if text.index('freeze-development:') < text.index('development:'):
              raise SystemExit('freeze-development must follow development')
          if text.index('holdout:') < text.index('freeze-development:'):
              raise SystemExit('holdout must follow freeze-development')
          if text.index('aggregate:') < text.index('holdout:'):
              raise SystemExit('aggregate must follow holdout')
          # Holdout execution must not exist in the development job.
          dev_block = text.split('  development:', 1)[1].split('  freeze-development:', 1)[0]
          if 'Run P6-IP frozen holdout chunk' in dev_block or 'p6_unseen.json' in dev_block:
              raise SystemExit('holdout execution leaked into development job')
      - name: Validate no automatic controlled rerun
        run: |
          grep -q '^  workflow_dispatch:$' .github/workflows/p6-ip-controlled.yml
          ! grep -q '^  push:' .github/workflows/p6-ip-controlled.yml
      - name: Validate regression tests
        run: |
          python -m pip install -r requirements.txt
          pytest -q tests/test_p6_ip.py tests/test_p6_analysis_integrity.py
