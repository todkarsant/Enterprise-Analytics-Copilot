name: P6-IP Validation

on:
  push:
    branches: [research/p6-ip-defensibility]
    paths:
      - 'research/p6_ip.py'
      - 'research/defensibility.py'
      - 'tests/test_p6_ip.py'
      - '.github/workflows/p6-ip-validation.yml'
  workflow_dispatch:

jobs:
  unit-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run P6-IP tests
        run: pytest -q tests/test_p6_ip.py
