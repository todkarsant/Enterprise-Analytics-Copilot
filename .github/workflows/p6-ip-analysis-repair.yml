name: P6-IP Analysis Repair

on:
  push:
    branches:
      - research/p6-ip-defensibility
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recompute-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      UNSEEN_FRACTION: '0.20'
      UNSEEN_SEED: '1729'
      SPIDER_EVALUATOR_COMMIT: b7b5b8c890cd30e35427348bb9eb8c6d1350ca7c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install gdown nltk
          python -m nltk.downloader punkt punkt_tab
      - name: Download Spider data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          gdown "https://drive.google.com/uc?id=1403EGqzIDoHMdQF4c9Bkyl7dZLZ5Wt6J" -O data/spider_data.zip
          unzip -q data/spider_data.zip -d data/spider_unpacked
          mkdir -p data/spider
          find data/spider_unpacked -name dev.json -exec cp {} data/spider/dev.json \;
          find data/spider_unpacked -name tables.json -exec cp {} data/spider/tables.json \;
          DB_DIR=$(find data/spider_unpacked -type d -name database | head -n 1); test -n "$DB_DIR"; cp -R "$DB_DIR" data/spider/database
          python scripts/validate_spider.py --root data/spider --write-unseen data/spider/dev_unseen_schema.json --unseen-fraction "$UNSEEN_FRACTION" --unseen-seed "$UNSEEN_SEED"
      - name: Fetch pinned evaluator
        run: |
          git clone --quiet https://github.com/taoyds/spider.git external/spider
          git -C external/spider checkout --quiet "$SPIDER_EVALUATOR_COMMIT"
      - name: Download frozen P0-P5 evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 34206500727
          github-token: ${{ github.token }}
          pattern: p1-spider-isolated-chunk-*
          path: artifacts/frozen
          merge-multiple: false
      - name: Download completed P6-IP chunks
        uses: actions/download-artifact@v4
        with:
          run-id: 34252265013
          github-token: ${{ github.token }}
          pattern: p6-ip-chunk-*
          path: artifacts/p6_chunks
          merge-multiple: false
      - name: Merge P6-IP development traces
        run: python scripts/merge_spider_benchmark_chunks.py --input-root artifacts/p6_chunks --pattern p6_dev.json --output artifacts/p6_dev.json
      - name: Merge P6-IP holdout traces
        run: python scripts/merge_spider_benchmark_chunks.py --input-root artifacts/p6_chunks --pattern p6_unseen.json --output artifacts/p6_unseen.json
      - name: Recompute P0 development official correctness
        run: python scripts/recompute_official_p0.py --p0-root artifacts/frozen --question-file data/spider/dev.json --database-dir data/spider/database --tables-file data/spider/tables.json --spider-eval-dir external/spider --output artifacts/p0_official_dev.json
      - name: Recompute P0 holdout official correctness
        run: python scripts/recompute_official_p0.py --p0-root artifacts/frozen --question-file data/spider/dev_unseen_schema.json --database-dir data/spider/database --tables-file data/spider/tables.json --spider-eval-dir external/spider --output artifacts/p0_official_holdout.json
      - name: Analyze corrected development comparison
        run: python scripts/analyze_p6_ip.py --p6 artifacts/p6_dev.json --p0 artifacts/p0_official_dev.json --output artifacts/p6_ip_corrected_dev_analysis.json
      - name: Analyze corrected holdout comparison
        run: python scripts/analyze_p6_ip.py --p6 artifacts/p6_unseen.json --p0 artifacts/p0_official_holdout.json --output artifacts/p6_ip_corrected_holdout_analysis.json
      - name: Publish correction manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = {
              "source_p6_run": 34252265013,
              "source_frozen_p0_run": 34206500727,
              "official_evaluator_commit": "b7b5b8c890cd30e35427348bb9eb8c6d1350ca7c",
              "inference_rerun": False,
              "p0_case_level_correctness": "recomputed_posthoc_from_frozen_sql",
              "holdout_used_for_tuning": False,
          }
          Path("artifacts/p6_ip_analysis_correction_manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p6-ip-corrected-analysis-${{ github.run_id }}
          path: artifacts/p6_ip_corrected_*json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: p6-ip-correction-provenance-${{ github.run_id }}
          path: |
            artifacts/p0_official_*.json
            artifacts/p6_ip_analysis_correction_manifest.json
          retention-days: 30
