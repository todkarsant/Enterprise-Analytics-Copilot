name: spider-benchmark

on:
  push:
    branches:
      - "research/p1-spider-adapter"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      LLM_PROVIDER: azure_openai
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install gdown

      - name: Verify Azure benchmark configuration
        run: |
          test -n "$AZURE_OPENAI_ENDPOINT"
          test -n "$AZURE_OPENAI_API_KEY"
          test -n "$AZURE_OPENAI_DEPLOYMENT"

      - name: Download official Spider 1.0 dataset
        run: |
          mkdir -p data
          gdown "https://drive.google.com/uc?id=1403EGqzIDoHMdQF4c9Bkyl7dZLZ5Wt6J" -O data/spider_data.zip
          unzip -q data/spider_data.zip -d data/spider_unpacked
          mkdir -p data/spider
          find data/spider_unpacked -name dev.json -exec cp {} data/spider/dev.json \;
          find data/spider_unpacked -name tables.json -exec cp {} data/spider/tables.json \;
          DB_DIR=$(find data/spider_unpacked -type d -name database | head -n 1)
          test -n "$DB_DIR"
          cp -R "$DB_DIR" data/spider/database
          test -s data/spider/dev.json
          test -s data/spider/tables.json
          test -d data/spider/database

      - name: Run P0-P5 benchmark
        run: |
          python -m research.spider_benchmark \
            --questions data/spider/dev.json \
            --database-dir data/spider/database \
            --output artifacts/spider/p0_p5.json

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: spider-p0-p5-benchmark
          path: artifacts/spider/p0_p5.json
          retention-days: 14
